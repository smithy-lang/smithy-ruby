sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

path: .gem_rbs_collection

gems:
  # Rake tasks load these project signatures explicitly from gems/*/sig.
  - name: smithy-cbor
    ignore: true
  - name: smithy-client
    ignore: true
  - name: smithy-json
    ignore: true
  - name: smithy-schema
    ignore: true
  - name: smithy-xml
    ignore: true
  - name: digest
    ignore: false
  - name: simplecov
    ignore: true
  - name: stringio
    ignore: false
  - name: tempfile
    ignore: false
  - name: uri
    ignore: false
